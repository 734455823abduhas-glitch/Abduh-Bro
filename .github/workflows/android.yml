name: Build Abduh Bro APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o AbduhBro_Android_Project.zip -d project

      - name: Fix Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          if "targetCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "    buildFeatures {",
                  '    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = "17" }\n    buildFeatures {'
              )
          p.write_text(s)
          PY

      - name: Fix Compose imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/java/com/abduhbro/accounting/MainActivity.kt")
          s = p.read_text()
          imports = "import androidx.compose.ui.platform.LocalLayoutDirection\nimport androidx.compose.ui.unit.LayoutDirection"
          if "import androidx.compose.ui.platform.LocalLayoutDirection" not in s:
              s = s.replace("package com.abduhbro.accounting", "package com.abduhbro.accounting\n\n" + imports, 1)
          p.write_text(s)
          PY

      - name: Build APK
        run: cd project && gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abduh-Bro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
