name: Build Abduh Bro APK

on:
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract project
    run: |
      mkdir project
      unzip -o AbduhBro_Android_Project.zip -d project

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Fix Android build configuration
    run: |
      cat > project/app/build.gradle.kts <<'EOF'
      plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
          id("org.jetbrains.kotlin.plugin.compose")
          id("com.google.devtools.ksp")
      }

      android {
          namespace = "com.abduhbro.accounting"
          compileSdk = 35

          defaultConfig {
              applicationId = "com.abduhbro.accounting"
              minSdk = 26
              targetSdk = 35
              versionCode = 1
              versionName = "0.1.0"
          }

          compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          buildFeatures {
              compose = true
          }
      }

      dependencies {
          implementation(platform("androidx.compose:compose-bom:2024.12.01"))
          implementation("androidx.activity:activity-compose:1.10.0")
          implementation("androidx.compose.ui:ui")
          implementation("androidx.compose.ui:ui-tooling-preview")
          implementation("androidx.compose.material3:material3")
          implementation("androidx.compose.material:material-icons-extended")
          implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
          implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
          implementation("androidx.room:room-runtime:2.6.1")
          implementation("androidx.room:room-ktx:2.6.1")
          ksp("androidx.room:room-compiler:2.6.1")
          debugImplementation("androidx.compose.ui:ui-tooling")
      }
      EOF

  - name: Build APK
    run: |
      cd project
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Abduh-Bro-APK
      path: project/app/build/outputs/apk/debug/app-debug.apk
