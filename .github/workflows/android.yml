name: Build Abduh Bro APK
on: workflow_dispatch: push:
jobs: build: runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract project
    run: |
      mkdir project
      unzip AbduhBro_Android_Project.zip -d project

  - name: Fix Java and Kotlin targets
    run: |
      sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' project/app/build.gradle.kts
      sed -i 's/JavaVersion.VERSION_1.8/JavaVersion.VERSION_17/g' project/app/build.gradle.kts
      sed -i '/android {/a\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' project/app/build.gradle.kts
      sed -i '/^tasks.withType/i tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions.jvmTarget = "17" }' project/app/build.gradle.kts

  - name: Build APK
    working-directory: project
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Abduh-Bro-APK
      path: project/app/build/outputs/apk/debug/app-debug.apk
